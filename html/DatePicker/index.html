<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DatePicker</title>
    <!-- <link rel="stylesheet" type="text/css" href="css/datePicker.css" /> -->
    <style type="text/css">
      .datepicker {
        height: 24px;
        line-height: 24px;
        width: 250px;
        padding: 5px;
        border: 1px solid #cccccc;
        border-radius: 5px;
      }

      .datepicker:focus {
        outline: 0 none;
        border: 1px solid #1abc9c;
      }

      h3 {
        color: #1abc9c;
      }

      h3,
      input {
        position: absolute;
        left: 30%;
      }

      input {
        top: 60px;
      }
    </style>
  </head>
  <body>
    <h3>请选择日期</h3>
    <input type="text" class="datepicker" placeholder="请选择日期" />
    <div class="ui-datePicker-wrapper"></div>
    <script src="date.js" type="text/javascript" charset="utf-8"></script>
    <script src="datePicker.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript">
      console.log('datepicker', datepicker);
      datepicker.init('.datepicker');
    </script>
  </body>
</html>
